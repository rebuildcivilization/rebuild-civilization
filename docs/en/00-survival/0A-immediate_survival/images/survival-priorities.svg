<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc">
<title id="title">Survival priorities: assess, act, reassess</title>
<desc id="desc">A flexible decision aid for prioritizing life threats, environmental hazards, rescue, water, shelter, and longer-term needs.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2.5;rx:18}
    .urgent{fill:#fff1f2;stroke:#be123c;stroke-width:3;rx:18}
    .action{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2.5;rx:18}
    .text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a;font-size:23px;text-anchor:middle}
    .small{font-family:Arial,Helvetica,sans-serif;fill:#334155;font-size:18px;text-anchor:middle}
    .arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1000" height="940" fill="#ffffff"/>
<text x="500" y="48" class="text" font-size="31" font-weight="700">SURVIVAL PRIORITIES</text>
<text x="500" y="78" class="small">A flexible decision aid — reassess as conditions change</text>
<rect x="250" y="112" width="500" height="80" class="box"/>
<text x="500" y="145" class="text" font-weight="700">ASSESS THE SITUATION</text>
<text x="500" y="173" class="small">Check hazards, injuries, resources, and rescue options</text>
<path d="M500 192 V226" class="arrow"/>
<rect x="290" y="230" width="420" height="78" class="urgent"/>
<text x="500" y="261" class="text" font-weight="700">IMMEDIATE LIFE THREAT?</text>
<text x="500" y="288" class="small">Severe bleeding, airway, breathing, other critical danger</text>
<path d="M290 269 H150 V342" class="arrow"/>
<text x="190" y="253" class="small">YES</text>
<rect x="35" y="346" width="230" height="94" class="urgent"/>
<text x="150" y="382" class="text" font-weight="700">ACT NOW</text>
<text x="150" y="410" class="small">First aid / immediate safety</text>
<path d="M150 440 V474 H500 V504" class="arrow"/>
<path d="M710 269 H850 V342" class="arrow"/>
<text x="810" y="253" class="small">NO</text>
<rect x="735" y="346" width="230" height="94" class="action"/>
<text x="850" y="382" class="text" font-weight="700">REDUCE EXPOSURE</text>
<text x="850" y="410" class="small">Cold, heat, weather, terrain</text>
<path d="M850 440 V474 H500 V504" class="arrow"/>
<rect x="190" y="508" width="620" height="100" class="action"/>
<text x="500" y="545" class="text" font-weight="700">ADDRESS ESSENTIAL NEEDS</text>
<text x="500" y="575" class="small">Rescue &amp; communication • water • shelter • warmth</text>
<text x="500" y="597" class="small">Choose the order according to the actual threat</text>
<path d="M500 608 V642" class="arrow"/>
<rect x="240" y="646" width="520" height="78" class="box"/>
<text x="500" y="677" class="text" font-weight="700">FOOD &amp; LONGER-TERM RESOURCES</text>
<text x="500" y="705" class="small">After immediate threats and essential needs are addressed</text>
<path d="M500 724 V758" class="arrow"/>
<rect x="300" y="762" width="400" height="72" class="box"/>
<text x="500" y="792" class="text" font-weight="700">REASSESS CONDITIONS</text>
<text x="500" y="818" class="small">Repeat the cycle whenever circumstances change</text>
<path d="M700 798 H925 V152 H755" class="arrow"/>
<text x="500" y="890" class="small">This is not a fixed sequence. Local conditions determine priorities.</text>
</svg>