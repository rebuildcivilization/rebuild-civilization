version: 1

statuses:
  verified:
    description:
      it: Supportato da almeno due fonti affidabili e indipendenti.
      en: Supported by at least two independent reliable sources.

  partially_verified:
    description:
      it: Alcune informazioni sono verificate mentre altre richiedono ulteriori evidenze.
      en: Some information is verified while other parts require additional evidence.

  single_source:
    description:
      it: Attualmente supportato da una sola fonte affidabile e indipendente.
      en: Currently supported by only one independent reliable source.

  conflicting_sources:
    description:
      it: Fonti affidabili forniscono informazioni incompatibili o divergenti.
      en: Reliable sources provide incompatible or divergent information.

  insufficient_sources:
    description:
      it: Le evidenze disponibili non sono sufficienti per una verifica affidabile.
      en: Available evidence is insufficient for reliable verification.

  unsourced:
    description:
      it: Non è ancora associata alcuna fonte affidabile.
      en: No reliable source has yet been associated.